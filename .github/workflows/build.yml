name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release__nightly:
        description: Create a production nightly release (default branch only)
        type: boolean
        required: false
        default: false
      use_swiftui_sidestore_preview:
        description: Embed a commit-pinned SideStore SwiftUI preview instead of production nightly
        type: boolean
        required: false
        default: false
      sidestore_preview_tag:
        description: SideStore preview tag, e.g. swiftui-preview-1c5409c
        type: string
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: xcode-27
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\\\.xcworkspace\\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\\\.xcworkspace\\$ || ls -A | grep -i \\\\.xcodeproj\\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Prepare Dependencies
        run: |
          sh .github/prepare_dependencies.sh
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty && exit ${PIPESTATUS[0]}
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Configure SideStore IPA source
        env:
          USE_SWIFTUI_SIDESTORE_PREVIEW: ${{ inputs.use_swiftui_sidestore_preview }}
          SIDESTORE_PREVIEW_TAG: ${{ inputs.sidestore_preview_tag }}
        run: |
          set -euo pipefail
          if [[ "$USE_SWIFTUI_SIDESTORE_PREVIEW" == "true" ]]; then
            if [[ ! "$SIDESTORE_PREVIEW_TAG" =~ ^swiftui-preview-[0-9a-f]{7,40}$ ]]; then
              echo "A valid commit-pinned SideStore preview tag is required." >&2
              exit 1
            fi
            SIDESTORE_IPA_URL="https://github.com/cicada4ever/SideStore/releases/download/$SIDESTORE_PREVIEW_TAG/SideStore.ipa"
            echo "Embedding SideStore preview: $SIDESTORE_PREVIEW_TAG"
          else
            SIDESTORE_IPA_URL="https://github.com/cicada4ever/SideStore/releases/download/nightly/SideStore.ipa"
            echo "Embedding production SideStore nightly from cicada4ever/SideStore"
          fi
          echo "SIDESTORE_IPA_URL=$SIDESTORE_IPA_URL" >> "$GITHUB_ENV"

      - name: Create IPA
        run: |
          sh .github/build_github.sh
      - name: Verify combined IPA compatibility
        env:
          EXPECTED_LC_BUNDLE_ID: com.kdt.livecontainer
          EXPECTED_SIDESTORE_BUNDLE_ID: com.SideStore.SideStore
        run: |
          bash .github/verify-combined-ipa.sh "$scheme+SideStore.ipa"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.release__nightly || github.event_name == 'push')
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}

            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh release view nightly >/dev/null 2>&1; then
              if gh release edit nightly --title "Nightly Release @ ${GITHUB_RUN_NUMBER}" --notes "$RELEASE_BODY" --prerelease; then
                break
              fi
            else
              if gh release create nightly --title "Nightly Release @ ${GITHUB_RUN_NUMBER}" --notes "$RELEASE_BODY" --prerelease; then
                break
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to create or update nightly release after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          for attempt in 1 2 3; do
            if gh release upload nightly "${{ needs.build.outputs.artifact }}" "${{ needs.build.outputs.artifact2 }}" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to upload nightly IPA assets after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Upload updated nightly source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh release upload nightly .github/apps_nightly.json --clobber; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to upload generated nightly source JSON after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
      - name: Ensure stable release exists and upload SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view 1.0 >/dev/null 2>&1; then
            # The fork already has the 1.0 Git tag. Create only the missing
            # GitHub Release object and refuse to synthesize a new tag.
            gh release create 1.0 --title "1.0" --notes "Stable release metadata for this fork." --verify-tag
          fi
          for attempt in 1 2 3; do
            if gh release upload 1.0 .github/apps_ss_lc.json --clobber; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to upload SideStore source JSON to the 1.0 release after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
